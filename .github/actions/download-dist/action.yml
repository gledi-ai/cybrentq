name: Download distribution artifacts
description: Merge the sdist + wheel artifacts produced earlier in the release into dist/.

runs:
  using: composite
  steps:
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        path: dist
        pattern: "{sdist,wheels-*}"
        merge-multiple: true
