name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  build-sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history + tags for setuptools-scm
      - uses: ./.github/actions/setup
        with:
          sync: "false"
      - name: Build sdist
        run: uv build --sdist
      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz
          retention-days: 7

  build-wheels:
    name: Build wheels (${{ matrix.os }} ${{ matrix.archs }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,    archs: x86_64 }
          - { os: ubuntu-24.04-arm, archs: aarch64 }
          - { os: macos-latest,     archs: arm64 }
          - { os: windows-latest,   archs: AMD64 }
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history + tags for setuptools-scm
      - uses: astral-sh/setup-uv@v8.2.0
      - name: Set up sccache (compiler cache, GitHub Actions backend)
        uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10
      - uses: pypa/cibuildwheel@v4.1.0
        env:
          CIBW_BUILD: "cp310-* cp311-* cp312-* cp313-* cp314-*"
          CIBW_SKIP: "*-musllinux_i686 *_i686 *-win32"
          CIBW_ARCHS: ${{ matrix.archs }}
          CIBW_BUILD_FRONTEND: "build[uv]"
          CIBW_BUILD_VERBOSITY: "1"
          CIBW_TEST_COMMAND: python {project}/scripts/smoke.py
          # --- Compiler cache (macOS host build only). ---
          # sccache uses the GitHub Actions cache API so wheels reuse object files
          # across releases. Enabled only on the macOS host build: wiring sccache
          # into the manylinux/musllinux *containers* broke the compile, so Linux
          # and Windows build with the default toolchain (no cache).
          SCCACHE_GHA_ENABLED: "true"
          CIBW_ENVIRONMENT_MACOS: >-
            SCCACHE_GHA_ENABLED=on
            CC="sccache clang" CXX="sccache clang++"
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.archs }}
          path: wheelhouse/*.whl
          retention-days: 7

  publish-testpypi:
    name: Publish to TestPyPI
    needs: [build-sdist, build-wheels]
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/cybrentq
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - name: Download all artifacts into dist/
        uses: ./.github/actions/download-dist
      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@v1.14.0
        with:
          repository-url: https://test.pypi.org/legacy/

  verify-testpypi:
    name: Verify TestPyPI install
    needs: publish-testpypi
    runs-on: ubuntu-latest
    env:
      TAG_REF: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Wait for TestPyPI index propagation
        run: sleep 60
      - name: Install from TestPyPI
        run: |
          VERSION="${TAG_REF#v}"
          python -m pip install \
            --index-url https://test.pypi.org/simple/ \
            --extra-index-url https://pypi.org/simple/ \
            "cybrentq==${VERSION}"
      - name: Smoke test
        run: python scripts/smoke.py

  publish-pypi:
    name: Publish to PyPI (manual approval)
    needs: verify-testpypi
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/cybrentq
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - name: Download all artifacts into dist/
        uses: ./.github/actions/download-dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@v1.14.0
