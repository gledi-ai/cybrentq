name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  build-sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history + tags for setuptools-scm
      - uses: ./.github/actions/setup
        with:
          sync: "false"
      - name: Build sdist
        run: uv build --sdist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdist
          path: dist/*.tar.gz
          retention-days: 7

  build-wheels:
    name: Build wheels (${{ matrix.os }} ${{ matrix.archs }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,    archs: x86_64 }
          - { os: ubuntu-24.04-arm, archs: aarch64 }
          - { os: macos-latest,     archs: arm64 }
          - { os: windows-latest,   archs: AMD64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history + tags for setuptools-scm
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Set up sccache (compiler cache, GitHub Actions backend)
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - uses: pypa/cibuildwheel@f9b966cfadf4109556cadc5bb39ddb72d0ce664e # v4.3.5
        env:
          CIBW_BUILD: "cp311-* cp312-* cp313-* cp314-* cp315-*"
          CIBW_SKIP: "*-musllinux_i686 *_i686 *-win32"
          CIBW_ARCHS: ${{ matrix.archs }}
          CIBW_BUILD_FRONTEND: "build[uv]"
          CIBW_BUILD_VERBOSITY: "1"
          CIBW_TEST_COMMAND: python {project}/scripts/smoke.py
          # --- Compiler cache (sccache, GitHub Actions v2 cache backend). ---
          # Wheels reuse object files across releases. Windows/MSVC left untouched.
          SCCACHE_GHA_ENABLED: "true"
          CIBW_ENVIRONMENT_MACOS: >-
            SCCACHE_GHA_ENABLED=on
            CC="sccache clang" CXX="sccache clang++"
          # Linux wheels build inside manylinux/musllinux containers, so sccache must
          # be installed there and the runner's GHA-cache credentials forwarded in.
          # The in-container sccache must be new enough for GitHub's v2 cache service
          # (ACTIONS_RESULTS_URL + ACTIONS_CACHE_SERVICE_V2); the v1 API (ACTIONS_CACHE_URL)
          # was retired in 2025, so older binaries fail server startup and break the build.
          CIBW_ENVIRONMENT_LINUX: >-
            SCCACHE_GHA_ENABLED=on
            CC="sccache cc" CXX="sccache c++"
          CIBW_ENVIRONMENT_PASS_LINUX: >-
            SCCACHE_GHA_ENABLED ACTIONS_CACHE_SERVICE_V2 ACTIONS_RESULTS_URL ACTIONS_RUNTIME_TOKEN
          # Static musl build runs on both glibc (manylinux) and musl (musllinux).
          # This binary wraps the compiler for the released wheels, so its download
          # is checksum-verified against the published sccache v0.16.0 artifacts.
          CIBW_BEFORE_ALL_LINUX: |
            set -euo pipefail
            arch="$(uname -m)"
            case "$arch" in
              x86_64)  sha=aec995a83ad3dff3d14b6314e08858b7b73d35ca85a5bcf3d3a9ec07dee35588 ;;
              aarch64) sha=f73a5c39f96bb6ebb89cc7915cf182260d4cbf30765322c5e793d0fe8bd80784 ;;
              *) echo "unsupported arch: $arch" >&2; exit 1 ;;
            esac
            url="https://github.com/mozilla/sccache/releases/download/v0.16.0/sccache-v0.16.0-${arch}-unknown-linux-musl.tar.gz"
            curl -fsSL -o /tmp/sccache.tar.gz "$url"
            echo "${sha}  /tmp/sccache.tar.gz" | sha256sum -c -
            tar -xzf /tmp/sccache.tar.gz -C /tmp
            install -m 0755 /tmp/sccache-*/sccache /usr/local/bin/sccache
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.archs }}
          path: wheelhouse/*.whl
          retention-days: 7

  publish-testpypi:
    name: Publish to TestPyPI
    needs: [build-sdist, build-wheels]
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/cybrentq
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download all artifacts into dist/
        uses: ./.github/actions/download-dist
      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/

  verify-testpypi:
    name: Verify TestPyPI install
    needs: publish-testpypi
    runs-on: ubuntu-latest
    env:
      TAG_REF: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Wait for TestPyPI index propagation
        run: sleep 60
      - name: Install from TestPyPI
        run: |
          VERSION="${TAG_REF#v}"
          python -m pip install \
            --index-url https://test.pypi.org/simple/ \
            --extra-index-url https://pypi.org/simple/ \
            "cybrentq==${VERSION}"
      - name: Smoke test
        run: python scripts/smoke.py

  publish-pypi:
    name: Publish to PyPI (manual approval)
    needs: verify-testpypi
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/cybrentq
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download all artifacts into dist/
        uses: ./.github/actions/download-dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
