name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  build-sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          python-version: "3.14"
      - name: Build sdist
        run: uv build --sdist
      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz
          retention-days: 7

  build-wheels:
    name: Build wheels (${{ matrix.os }} ${{ matrix.archs }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,    archs: x86_64 }
          - { os: ubuntu-24.04-arm, archs: aarch64 }
          - { os: macos-latest,     archs: arm64 }
          - { os: macos-13,         archs: x86_64 }
          - { os: windows-latest,   archs: AMD64 }
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.1.0
      - uses: pypa/cibuildwheel@v3.4.1
        env:
          CIBW_BUILD: "cp310-* cp311-* cp312-* cp313-* cp314-*"
          CIBW_SKIP: "*-musllinux_i686 *_i686 *-win32"
          CIBW_ARCHS: ${{ matrix.archs }}
          CIBW_BUILD_FRONTEND: "build[uv]"
          CIBW_BUILD_VERBOSITY: "1"
          CIBW_TEST_COMMAND: >-
            python -c "from cybrentq import brentq;
            assert abs(brentq(lambda x: x*x-2, 0, 2) - 2**0.5) < 1e-10"
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.archs }}
          path: wheelhouse/*.whl
          retention-days: 7

  publish-testpypi:
    name: Publish to TestPyPI
    needs: [build-sdist, build-wheels]
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/cybrentq
    permissions:
      id-token: write
    steps:
      - name: Download all artifacts into dist/
        uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: "{sdist,wheels-*}"
          merge-multiple: true
      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@v1.14.0
        with:
          repository-url: https://test.pypi.org/legacy/

  verify-testpypi:
    name: Verify TestPyPI install
    needs: publish-testpypi
    runs-on: ubuntu-latest
    env:
      TAG_REF: ${{ github.ref_name }}
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Wait for TestPyPI index propagation
        run: sleep 60
      - name: Install from TestPyPI
        run: |
          VERSION="${TAG_REF#v}"
          python -m pip install \
            --index-url https://test.pypi.org/simple/ \
            --extra-index-url https://pypi.org/simple/ \
            "cybrentq==${VERSION}"
      - name: Smoke test
        run: |
          python -c "from cybrentq import brentq;
          assert abs(brentq(lambda x: x*x-2, 0, 2) - 2**0.5) < 1e-10"

  publish-pypi:
    name: Publish to PyPI (manual approval)
    needs: verify-testpypi
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/cybrentq
    permissions:
      id-token: write
    steps:
      - name: Download all artifacts into dist/
        uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: "{sdist,wheels-*}"
          merge-multiple: true
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@v1.14.0
