name: CI on PRs

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint & format (prek)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14" # matches default_language_version in .pre-commit-config.yaml
      - uses: ./.github/actions/setup # the pyrefly hook runs `uv run --frozen pyrefly check`
      - uses: j178/prek-action@bdca6f102f98e2b4c7029491a53dfd366469e33d # v2

  test:
    name: Tests (py ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run pytest
        run: make test

  coverage:
    name: Coverage (py 3.14, traced build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          sync: "false"
      - name: Run coverage (rebuilds Cython with CYTHON_TRACE=1)
        run: make cov
      - name: Generate XML + HTML reports
        run: |
          uv run --frozen coverage xml
          uv run --frozen coverage html
      - name: Print textual report into job log
        run: make report
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: |
            coverage.xml
            htmlcov/
          retention-days: 7

  bench:
    name: Benchmarks (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Run benchmark smoke
        run: make bench BENCH_ARGS="--n-calls 500 --repeats 3" | tee bench.txt
      - name: Upload bench output
        uses: actions/upload-artifact@v7
        with:
          name: bench-output
          path: bench.txt
          retention-days: 7
