[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8", "wheel", "cython>=3.2"]
build-backend = "setuptools.build_meta"

[project]
name = "cybrentq"
dynamic = ["version"]
description = "A Cython implementation of Brent's root-finding method"
readme = "README.md"
requires-python = ">=3.11,<4.0"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Gledis Caushaj", email = "201947707+gledi-ai@users.noreply.github.com" },
]
keywords = [
  "brent",
  "root-finding",
  "cython",
  "numerical",
  "optimization",
  "bisection",
  "scipy",
  "mathematics",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Programming Language :: Cython",
  "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/gledi-ai/cybrentq"
Repository = "https://github.com/gledi-ai/cybrentq"
Documentation = "https://github.com/gledi-ai/cybrentq"

[dependency-groups]
scipy-stack = [
  "numpy~=2.4.0; python_version < '3.12'",
  "numpy~=2.5.0; python_version >= '3.12'",
  "scipy~=1.17.0; python_version < '3.12'",
  "scipy~=1.18.0; python_version >= '3.12'",
]
test = ["pytest~=9.1", "coverage~=7.17", { include-group = "scipy-stack" }]
bench = ["pymodab~=1.0", { include-group = "scipy-stack" }]
build = ["cython~=3.3.0", "setuptools>=77", "setuptools-scm~=10.3", "wheel"]
dev = [
  { include-group = "test" },
  { include-group = "bench" },
  { include-group = "build" },
  "ruff~=0.17.0",
  "pyrefly~=1.4.0",
]

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["cybrentq"]

[tool.setuptools.package-data]
cybrentq = ["*.pyi", "py.typed"]

[tool.setuptools_scm]
version_file = "src/cybrentq/_version.py"
fallback_version = "0.0.0"

[tool.uv]
package = true
exclude-newer = "1 week"
exclude-newer-package = { ruff = "1 day", pyrefly = "1 day" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"

[tool.coverage.run]
branch = true
source = ["cybrentq"]
plugins = ["Cython.Coverage"]

[tool.coverage.report]
show_missing = true
skip_covered = false
precision = 2

[tool.pyrefly]
preset = "strict"
python-version = "3.11"
# Replaces pyrefly's defaults; .gitignore already covers .venv/__pycache__/build
# via use-ignore-files. setup.py is a build script, not shipped code.
project-excludes = ["setup.py"]

# Test bodies pass bare lambdas and fixture params around; annotating every one
# adds noise without catching bugs.
[[tool.pyrefly.sub-config]]
matches = "tests/**"

[tool.pyrefly.sub-config.errors]
implicit-any-parameter = false
implicit-any-lambda = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
  "A",    # flake8-builtins
  "B",    # flake8-bugbear
  "C90",  # mccabe complexity
  "E",    # pycodestyle errors
  "F",    # pyflakes
  "I",    # isort
  "N",    # pep8-naming
  "PERF", # perflint
  "PT",   # flake8-pytest-style
  "RUF",  # ruff-native
  "SIM",  # flake8-simplify
  "TRY",  # tryceratops
  "UP",   # pyupgrade
  "W",    # pycodestyle warnings
]
ignore = [
  "COM812", # conflicts with formatter
  "TRY003", # long messages outside exception class — noisy for ValueError
  "TRY300", # consider moving to else — often makes code worse
]
unfixable = []

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint.isort]
known-first-party = ["cybrentq"]
known-third-party = ["numpy", "scipy"]
